name: Build Wingo Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o WingoTrackerAndroid_BuildReady.zip -d project

      - name: Build APK
        run: |
          cd project/WingoTrackerAndroid
          gradle --version || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WingoTracker-debug-apk
          path: project/WingoTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
